<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة الثعبان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الثعبان">
<meta name="theme-color" content="#1B3D25">

<style>
:root{
  --bg:#EAF2E3; --board:#D5E5C4; --grid:#C6DAB1; --snake:#2F5D3A; --head:#1B3D25; --food:#D8452E; --ink:#1B2A1E; --muted:#51694F; --card:#F6FAF1;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#101A12;--board:#1A2A1E;--grid:#203324;--snake:#7BC47F;--head:#B8EDB0;--food:#FF6B4F;--ink:#E6F2E3;--muted:#8FA98D;--card:#17241A;}
}
:root[data-theme="dark"]{--bg:#101A12;--board:#1A2A1E;--grid:#203324;--snake:#7BC47F;--head:#B8EDB0;--food:#FF6B4F;--ink:#E6F2E3;--muted:#8FA98D;--card:#17241A;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;touch-action:manipulation}
h1{margin:0;font-size:1.6rem}
.bar{display:flex;gap:12px;width:min(92vw,420px)}
.stat{flex:1;background:var(--card);border-radius:12px;padding:8px 12px;text-align:center}
.stat b{display:block;font-size:1.4rem}
.stat span{font-size:.8rem;color:var(--muted)}
.wrap{position:relative;width:min(96vw,56dvh,560px)}
canvas{width:100%;aspect-ratio:1;display:block;background:var(--board);border-radius:14px;touch-action:none}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--bg) 82%,transparent);border-radius:14px;text-align:center}
.over h2{margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 22px;background:var(--snake);color:var(--bg);font-weight:700}
button:focus-visible{outline:3px solid var(--food);outline-offset:2px}
.pad{display:flex;gap:12px;direction:ltr;width:min(96vw,560px)}
.pad button{flex:1;height:112px;user-select:none;touch-action:manipulation;padding:0;font-size:2.2rem;background:var(--card);color:var(--ink)}
.pad button:active{background:var(--snake);color:var(--bg)}
.hint{color:var(--muted);font-size:.85rem;margin:0}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{transition:background .3s,color .3s}
canvas{box-shadow:0 10px 28px rgba(0,0,0,.22),0 0 0 4px var(--grid)}
.stat{box-shadow:inset 0 0 0 1px var(--grid)}
button{transition:transform .06s,background .15s;-webkit-appearance:none;appearance:none}
.chip,.opts select{box-shadow:inset 0 0 0 1px var(--grid)}
.pad button{box-shadow:0 4px 0 var(--grid),inset 0 0 0 1px var(--grid);border-radius:18px}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--grid)}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(92vw,420px)}
.chip,.opts select{font:inherit;background:var(--card);color:var(--ink);border:0;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:6px}
:root{--w:max(190px,min(96vw,calc(100dvh - 400px),560px))}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;min-height:0;justify-content:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 8px)}
h1{font-size:1.35rem}
.bar,.wrap,.opts{width:var(--w)}
.pad button{height:clamp(76px,12dvh,112px)}
.verse{font-family:'Aref Ruqaa','Amiri','Scheherazade New',serif;text-align:center;line-height:1.5;font-size:clamp(1.05rem,3.2dvh,1.5rem);color:var(--ink);margin:0}
.verse span{display:block}
.verse .o{color:var(--food);font-size:.7em;line-height:1}
@media (hover:none){.kb{display:none}}
</style>
</head>
<body>
<h1>لعبة الثعبان</h1>
<p class="verse" aria-label="بيت شعر"><span>علموني لعبة الدوده</span><span class="o">❖</span><span>كودها من الهم تسليني</span></p>
<div class="bar">
  <div class="stat"><b id="score">0</b><span>النقاط</span></div>
  <div class="stat"><b id="best">0</b><span>أعلى نتيجة</span></div>
</div>
<div class="wrap">
  <canvas id="c" width="420" height="420"></canvas>
  <div class="over" id="ov"><h2 id="ovt">جاهز؟</h2><p class="hint" id="ovs">استخدم الأسهم أو اسحب بإصبعك</p><p class="hint" id="tp"></p><button id="go">ابدأ اللعب</button></div>
</div>
<p class="hint" id="st" style="min-height:1.3em"></p>
<div class="opts">
  <select id="lvl" aria-label="الصعوبة"><option value="e">سهل</option><option value="m" selected>متوسط</option><option value="h">صعب</option></select>
  <select id="theme" aria-label="الألوان"><option value="forest">🌿 الغابة</option><option value="ocean">🌊 المحيط</option><option value="sunset">🌇 الغروب</option><option value="neon">⚡ النيون</option><option value="nokia">🟩 نوكيا</option><option value="midnight">🌙 ليلي</option><option value="rose">🌸 وردي</option><option value="desert">🏜️ الصحراء</option><option value="gold">👑 ذهبي</option></select>
  <label class="chip"><input type="checkbox" id="rocks"> عقبات</label>
  <label class="chip"><input type="checkbox" id="wrap"> بدون جدران</label>
  <button class="chip" id="pz" aria-label="إيقاف مؤقت">⏸</button>
  <button class="chip" id="mute" aria-label="الصوت">🔊</button>
  <button class="chip" id="fs" aria-label="ملء الشاشة">⛶</button>
</div>
<div class="pad">
  <button data-k="l" aria-label="زر اليسار: يسار ثم أسفل">◀</button>
  <button data-k="r" aria-label="زر اليمين: أعلى ثم يمين">▲</button>
</div>
<p class="hint kb">مسافة للإيقاف المؤقت</p>
<script>
(function(){
  var N=20, L=420, cv=document.getElementById('c'), ctx=cv.getContext('2d'), DPR=Math.min(window.devicePixelRatio||1,3), S=L/N;cv.width=cv.height=Math.round(L*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  var sc=document.getElementById('score'), bestEl=document.getElementById('best'), lvl=document.getElementById('lvl'), wrapEl=document.getElementById('wrap'), rockEl=document.getElementById('rocks');
  var ov=document.getElementById('ov'), ovt=document.getElementById('ovt'), ovs=document.getElementById('ovs'), go=document.getElementById('go');
  var V={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
  var snake,dir,next,food,score,best=0,timer,running=false,paused=false,bonus=null,muted=false,ac=null,rocks=[],pw=null,slowT=0,shield=false,prev=null,lastT=0,intv=120,fx=[],queue=[],counting=false,cdN=0;
  try{best=+localStorage.getItem('snakeBest')||0}catch(e){}
  bestEl.textContent=best;
  var PIX=false,PAL={};function css(n){return PAL[n]||(PAL[n]=getComputedStyle(document.documentElement).getPropertyValue(n).trim())}
  function beep(f,l,w,f2){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();var t=ac.currentTime+(w||0),d=l||.06,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);var v=f>2000?.3:.12;g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+d-.008);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.01)}catch(e){}}
  function tune(a){var w=0;a.forEach(function(n){if(n[0])beep(n[0],n[1],w,n[2]);w+=n[1]})}
  function spawnBonus(){var p;do{p=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(snake.some(function(s){return s[0]==p[0]&&s[1]==p[1]})||(p[0]==food[0]&&p[1]==food[1])||hasRock(p));bonus=[p[0],p[1],45]}
  function spawnPower(){var p,t=0;do{p=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)];t++}while(t<200&&(snake.some(function(s){return s[0]==p[0]&&s[1]==p[1]})||hasRock(p)||(p[0]==food[0]&&p[1]==food[1])||(bonus&&p[0]==bonus[0]&&p[1]==bonus[1])));pw=[p[0],p[1],50,Math.random()<.5?'s':'h']}
  function stat(){document.getElementById('st').textContent='المستوى '+(1+Math.floor(score/5))+'   '+(slowT>0?'⏱️ إبطاء   ':'')+(shield?'🛡️ درع':'')}
  function pos(s,i,t){var o=prev&&prev[i];if(!o||t>=1)return s;var dx=s[0]-o[0],dy=s[1]-o[1];if(Math.abs(dx)>1||Math.abs(dy)>1)return s;return [o[0]+dx*t,o[1]+dy*t]}
  function spawnFx(x,y,c){for(var i=0;i<12;i++){var a=Math.random()*6.28,sp=1+Math.random()*2.5;fx.push([x*S+S/2,y*S+S/2,Math.cos(a)*sp,Math.sin(a)*sp,24,c])}}
  function drawFx(){for(var i=fx.length-1;i>=0;i--){var p=fx[i];p[0]+=p[2];p[1]+=p[3];p[4]--;if(p[4]<=0){fx.splice(i,1);continue}ctx.globalAlpha=p[4]/24;ctx.fillStyle=p[5];ctx.beginPath();ctx.arc(p[0],p[1],3,0,7);ctx.fill()}ctx.globalAlpha=1}
  function frame(){if(snake&&((running&&!paused)||fx.length))draw();requestAnimationFrame(frame)}
  function hasRock(p){return rocks.some(function(r){return r[0]==p[0]&&r[1]==p[1]})}
  function addRock(){var p,t=0;do{p=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)];t++}while(t<200&&(snake.some(function(s){return s[0]==p[0]&&s[1]==p[1]})||hasRock(p)||(p[0]==food[0]&&p[1]==food[1])||(bonus&&p[0]==bonus[0]&&p[1]==bonus[1])||Math.abs(p[0]-snake[0][0])+Math.abs(p[1]-snake[0][1])<6));rocks.push(p)}
  function eyes(s){var d=V[dir],q=[-d[1],d[0]];[1,-1].forEach(function(k){var x=s[0]*S+S/2+d[0]*S*.18+q[0]*k*S*.22,y=s[1]*S+S/2+d[1]*S*.18+q[1]*k*S*.22;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,S*.12,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+d[0]*S*.03,y+d[1]*S*.03,S*.06,0,7);ctx.fill()})}
  function place(){
    do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}
    while(snake.some(function(s){return s[0]==food[0]&&s[1]==food[1]})||hasRock(food));
  }
  function reset(){
    snake=[[10,10],[9,10],[8,10]];dir='R';next='R';score=0;bonus=null;rocks=[];pw=null;slowT=0;shield=false;queue=[];prev=null;fx=[];sc.textContent=0;place();if(rockEl.checked)for(var i=0;i<5;i++)addRock();refresh();stat();
  }
  var base={e:150,m:120,h:90};function speed(){return Math.max(50,base[lvl.value]-score*3)*(slowT>0?1.7:1)}
  function loop(){
    timer=setTimeout(function(){tick();if(running)loop()},speed());
  }
  function start(){
    reset();paused=false;clearTimeout(timer);ov.style.display='none';running=true;counting=true;cdN=4;(function step(){cdN--;if(cdN<=0){counting=false;lastT=performance.now();intv=speed();loop();return}beep(900,.08);timer=setTimeout(step,600)})();
  }
  function end(){
    running=false;clearTimeout(timer);
    var rec=score>best;tune(rec?[[2360,.144],[0,.09],[2336,.06],[2347,.04],[2933,.04],[2360,.11],[2936,.04],[2640,.44],[2352,.04],[2933,.1],[2635,.51]]:[[2909,.186],[0,.126],[2933,.282],[2694,.44],[2928,.13],[2699,.03],[2637,.1]]);if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('snakeBest',best)}catch(e){}}
    var tp=[];try{tp=JSON.parse(localStorage.getItem('snakeTop')||'[]')}catch(e){}
    if(score>0){tp.push(score);tp.sort(function(a,b){return b-a});tp=tp.slice(0,5);try{localStorage.setItem('snakeTop',JSON.stringify(tp))}catch(e){}}
    document.getElementById('tp').textContent=tp.length?'🏆 '+tp.join(' · '):'';
    if(navigator.vibrate)try{navigator.vibrate(200)}catch(e){}
    ovt.textContent='انتهت اللعبة';ovs.textContent='نتيجتك: '+score+(rec?' — رقم قياسي! 🎉':'');go.textContent='العب مرة ثانية';ov.style.display='flex';
  }
  function tick(){
    if(queue.length)next=queue.shift();dir=next;refresh();var d=V[dir],h=[snake[0][0]+d[0],snake[0][1]+d[1]];
    if(wrapEl.checked){h[0]=(h[0]+N)%N;h[1]=(h[1]+N)%N}
    var hit=h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||hasRock(h)||snake.some(function(s){return s[0]==h[0]&&s[1]==h[1]});
    if(hit&&shield){shield=false;h[0]=(h[0]+N)%N;h[1]=(h[1]+N)%N;hit=false;tune([[2630,.035]])}
    if(hit){spawnFx(snake[0][0],snake[0][1],css('--snake'));draw();end();return}
    prev=snake.slice();snake.unshift(h);lastT=performance.now();
    var ate=false;
    if(h[0]==food[0]&&h[1]==food[1]){score++;ate=true;place();spawnFx(h[0],h[1],css('--food'));tune([[2630,.025]]);if(score%7==0)spawnPower();if(score%5==0){spawnBonus();if(rockEl.checked)addRock()}}
    else if(bonus&&h[0]==bonus[0]&&h[1]==bonus[1]){score+=3;ate=true;bonus=null;spawnFx(h[0],h[1],'#F2B705');tune([[2630,.035],[0,.05],[2630,.035]])}
    else if(pw&&h[0]==pw[0]&&h[1]==pw[1]){if(pw[3]=='s')slowT=70;else shield=true;pw=null;spawnFx(h[0],h[1],'#4DA3FF');tune([[2630,.035]])}
    if(!ate)snake.pop();
    sc.textContent=score;
    if(bonus&&--bonus[2]<=0)bonus=null;
    if(pw&&--pw[2]<=0)pw=null;
    if(slowT>0)slowT--;intv=speed();
    stat();
    draw();
  }
  function draw(){var t=1;if(running&&!paused&&!counting&&prev)t=Math.min(1,(performance.now()-lastT)/intv);drawBase(t);if(counting&&cdN>0){ctx.globalAlpha=1;ctx.fillStyle=css('--ink');ctx.font='bold '+(S*4)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(cdN,L/2,L/2)}drawFx()}
  function drawBase(t){
    ctx.clearRect(0,0,L,L);
    ctx.fillStyle=css('--grid');
    if(!PIX)for(var x=0;x<N;x++)for(var y=0;y<N;y++)if((x+y)%2)ctx.fillRect(x*S,y*S,S,S);
    ctx.fillStyle=css('--food');ctx.beginPath();if(PIX){var qx=food[0]*S+S/2,qy=food[1]*S+S/2,qr=S*.42;ctx.moveTo(qx,qy-qr);ctx.lineTo(qx+qr,qy);ctx.lineTo(qx,qy+qr);ctx.lineTo(qx-qr,qy)}else ctx.arc(food[0]*S+S/2,food[1]*S+S/2,S*.38,0,7);ctx.fill();
    if(bonus){ctx.fillStyle='#F2B705';ctx.beginPath();ctx.arc(bonus[0]*S+S/2,bonus[1]*S+S/2,S*(bonus[2]<12&&bonus[2]%2?.25:.44),0,7);ctx.fill()}
    if(pw){ctx.font=(S*.8)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';if(!(pw[2]<12&&pw[2]%2))ctx.fillText(pw[3]=='s'?'⏱️':'🛡️',pw[0]*S+S/2,pw[1]*S+S/2+1)}
    ctx.fillStyle=css('--muted');rocks.forEach(function(r){ctx.beginPath();ctx.roundRect(r[0]*S+2,r[1]*S+2,S-4,S-4,5);ctx.fill()});
    snake.forEach(function(s0,i){var s=pos(s0,i,t);
      ctx.globalAlpha=(i&&!PIX)?Math.max(.5,1-i*.03):1;ctx.fillStyle=i?css('--snake'):css('--head');
      var p=i?2:1;ctx.beginPath();ctx.roundRect(s[0]*S+p,s[1]*S+p,S-2*p,S-2*p,PIX?1:6);ctx.fill();ctx.globalAlpha=1;if(!i){if(!PIX)eyes(s);if(shield){ctx.strokeStyle='#4DA3FF';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s[0]*S+S/2,s[1]*S+S/2,S*.55,0,7);ctx.stroke()}}
    });
  }
  function turn(k){
    if(!running||paused||counting)return;var lp=queue.length?queue[queue.length-1]:next;
    var opp={U:'D',D:'U',L:'R',R:'L'};
    if(k!==lp&&k!==opp[lp]&&queue.length<2){queue.push(k);refresh();if(navigator.vibrate)navigator.vibrate(8);if(performance.now()-lastT>intv*.55){clearTimeout(timer);tick();if(running)loop()}}
  }
  document.addEventListener('keydown',function(e){
    var m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R'};
    if(m[e.key]){e.preventDefault();turn(m[e.key])}
    else if(e.key===' '){e.preventDefault();if(!running||counting)return;paused=!paused;
      if(paused){clearTimeout(timer);ovt.textContent='متوقفة';ovs.textContent='اضغط ⏸ أو مسافة للمتابعة';go.style.display='none';ov.style.display='flex'}
      else{ov.style.display='none';go.style.display='';lastT=performance.now();loop()}}
  });
  var arr={U:'▲',D:'▼',L:'◀',R:'▶'},btns=document.querySelectorAll('.pad button');
  function target(k){var pl=queue.length?queue[queue.length-1]:next,h=(pl=='L'||pl=='R');return k=='r'?(h?'U':'R'):(h?'D':'L')}
  function refresh(){btns.forEach(function(b){b.textContent=arr[target(b.dataset.k)]})}
  btns.forEach(function(b){
    b.addEventListener('pointerdown',function(e){e.preventDefault();turn(target(b.dataset.k));refresh()});
  });
  var sx,sy;
  cv.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  cv.addEventListener('touchmove',function(e){var t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));sx=t.clientX;sy=t.clientY;e.preventDefault()},{passive:false});
  cv.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));
  });
  document.getElementById('pz').addEventListener('click',function(){document.dispatchEvent(new KeyboardEvent('keydown',{key:' '}))});
  function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
  document.addEventListener('pointerdown',unlock,{once:true});document.addEventListener('keydown',unlock,{once:true});
  var fsb=document.getElementById('fs'),de=document.documentElement;if(!(de.requestFullscreen||de.webkitRequestFullscreen))fsb.style.display='none';
